name: Bug report
description: Something crashes, doesn't build or behaves wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a crash on a specific frame or a way to stop monitoring? Please
        report it privately instead, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: Commands, settings, or a .pcap that shows it (only from networks you're allowed to capture).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit hash
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Host build / tests
        - Replay tool
        - Firmware on a board
        - Firmware build
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Serial log, build error or test output.
      render: text
