name: ci

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: clang-format
        run: |
          clang-format-18 --version
          find core modules platform tools tests firmware -name '*.cpp' -o -name '*.hpp' \
            | xargs clang-format-18 --dry-run --Werror

  host:
    name: host (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v5
      - name: configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DINAPPARENCY_WERROR=ON
      - name: build
        run: cmake --build build -j
      - name: test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: host (asan + ubsan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DINAPPARENCY_WERROR=ON
          -DINAPPARENCY_SANITIZE=ON
      - name: build
        run: cmake --build build -j
      - name: test
        run: ctest --test-dir build --output-on-failure

  firmware:
    name: firmware (${{ matrix.target }})
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.4.1
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3, esp32c3, esp32c6]
    steps:
      - uses: actions/checkout@v5
      - name: build (with display and SD card)
        shell: bash
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-full -D SDKCONFIG=build-full/sdkconfig \
            -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci.full" \
            set-target ${{ matrix.target }} build
      - name: build (base)
        shell: bash
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target ${{ matrix.target }} build
          idf.py size
      - name: upload
        uses: actions/upload-artifact@v6
        with:
          name: inapparency-${{ matrix.target }}
          path: |
            firmware/build/inapparency.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flash_args
